version: "3.8"

services:
  django-dev:
    build: .
    container_name: django-dev
    volumes:
      - .:/app
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
    ports:
      - "8001:8000"
    env_file:
      - .env.dev
    networks:
      - college-network
    restart: unless-stopped

networks:
  college-network:
    external: true
