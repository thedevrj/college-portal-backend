version: '3.8'

services:
  django-dev:
    build: .
    container_name: django-dev
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - ./media:/app/media
      - ./static:/app/static
    ports:
      - "8001:8000"
    env_file:
      - .env.dev
    depends_on:
      - postgres
    networks:
      - college-network
    restart: unless-stopped

networks:
  college-network:
    external: true
