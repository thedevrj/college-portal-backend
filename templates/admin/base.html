{% extends "admin/base.html" %}
{% load static %}

{% block extrahead %}
{{ block.super }}
{% if request.user.is_authenticated %}
<script src="{% static 'js/admin_dynamic_fields.js' %}"></script>
<script>
    // Inject user data for sidebar UI updates
    window.PORTAL_USER = {
        displayName: "{{ request.user.get_full_name|escapejs }}",
        avatarUrl: "{% if request.user.portal_profile.profile_photo %}{{ request.user.portal_profile.profile_photo.url }}{% elif request.user.faculty_profile.photo %}{{ request.user.faculty_profile.photo.url }}{% endif %}"
    };

    // Sidebar scroll persistence and active item focus
    function scrollToActiveSidebarItem() {
        const sidebar = document.querySelector('.main-sidebar .os-viewport') ||
                        document.querySelector('.sidebar') ||
                        document.querySelector('.main-sidebar');

        if (!sidebar) return;

        let activeItem = document.querySelector('.nav-sidebar .nav-link.active');

        if (!activeItem) {
            const currentPath = window.location.pathname;
            const link = document.querySelector(`.nav-sidebar a[href="${currentPath}"]`) ||
                         document.querySelector(`.nav-sidebar a[href^="${currentPath}"]`);
            if (link) {
                link.classList.add('active');
                activeItem = link;
                const parentNav = link.closest('.has-treeview');
                if (parentNav) {
                    parentNav.classList.add('menu-open');
                    const childUl = parentNav.querySelector('.nav-treeview');
                    if (childUl) childUl.style.display = 'block';
                }
            }
        }

        if (activeItem) {
            activeItem.scrollIntoView({ behavior: 'auto', block: 'center' });
            if (sidebar.scrollTop !== undefined) {
                sessionStorage.setItem('sidebarScrollPos', sidebar.scrollTop);
            }
        } else {
            const savedScrollPos = sessionStorage.getItem('sidebarScrollPos');
            if (savedScrollPos !== null) {
                sidebar.scrollTop = parseInt(savedScrollPos, 10);
            }
        }
    }

    document.addEventListener("DOMContentLoaded", function() {
        const sidebar = document.querySelector('.main-sidebar .os-viewport') ||
                        document.querySelector('.sidebar') ||
                        document.querySelector('.main-sidebar');

        // Scroll immediately, then after Jazzmin and OverlayScrollbars finish initializing
        scrollToActiveSidebarItem();
        setTimeout(scrollToActiveSidebarItem, 150);
        setTimeout(scrollToActiveSidebarItem, 400);

        if (sidebar) {
            sidebar.addEventListener('scroll', function() {
                sessionStorage.setItem('sidebarScrollPos', sidebar.scrollTop);
            });
        }

        document.querySelectorAll('.nav-sidebar .nav-link').forEach(link => {
            link.addEventListener('click', function() {
                if (sidebar) {
                    sessionStorage.setItem('sidebarScrollPos', sidebar.scrollTop);
                }
            });
        });
    });
</script>
{% endif %}
{% endblock %}
